# ──────────────────────────────────────────────────────────────────────────
# Deploy the LearnQuest AI docs (Docusaurus) to GitHub Pages.
#
# Dual hosting: this site is ALSO deployable to Firebase Hosting
# (`yarn firebase:deploy`). GitHub Pages serves the custom domain set in
# static/CNAME (learnqai-docs.aoneahsan.com).
#
# To enable: repo Settings → Pages → Source = "GitHub Actions". DNS: point a
# CNAME record for learnquest-ai-docs → aoneahsan.github.io.
# ──────────────────────────────────────────────────────────────────────────
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack (Yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
